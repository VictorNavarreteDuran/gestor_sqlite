<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PIME ERP — Panel de Inicio</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="dashboard-body">
  <!-- Navbar Principal (Montaje Modular) -->
  <div id="mount-navbar"></div>

  <!-- Contenedor Principal de Secciones (Montaje Modular) -->
  <div class="dashboard-wrapper">
    <!-- Vista Principal: Inicio -->
    <div id="mount-inicio"></div>

    <!-- Vista de Inventario -->
    <div id="mount-inventario"></div>

    <!-- Vista de Gestión de Stock, Productos Nuevos y Mermas (Kardex) -->
    <div id="mount-kardex"></div>

    <!-- Vista de Ingreso / Registro de Ventas (POS) -->
    <div id="mount-ventas"></div>

    <!-- Vista de Clientes y Proveedores (Ley 21.719 Chile) -->
    <div id="mount-clientes"></div>

    <!-- Vista de Finanzas -->
    <div id="mount-finanzas"></div>

    <!-- Vista de Otros Módulos del Navbar (Compras, etc.) -->
    <div id="mount-placeholder"></div>
  </div>

  <!-- Motor SQLite WebAssembly (sql.js) -->
  <script src="/vendor/sql.js/sql-wasm.js"></script>
  <script src="/local-sqlite.js"></script>

  <!-- Orquestador Modular del Dashboard (Fases 1, 2 y 3) -->
  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
